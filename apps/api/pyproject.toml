[project]
name = "bismark-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "sqlalchemy>=2.0.54",
    "alembic>=1.20.0",
    "psycopg[binary]>=3.3.6",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest", "httpx", "ruff", "mypy"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
